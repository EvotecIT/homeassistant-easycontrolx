  fields:
    config_entry_id:
      name: Config entry ID
      description: Target a specific EasyControlX host when multiple hosts are configured.
      example: "01JABCDEF0123456789XYZ"
      selector:
        text:

browse_files:
  name: Browse files
  description: Return a file listing from an EasyControlX host.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Target a specific EasyControlX host when multiple hosts are configured.
      example: "01JABCDEF0123456789XYZ"
      selector:
        text:
    path:
      name: Path
      description: Optional host path to browse. Omit to browse the host default root.
      example: "C:\\Users"
      selector:
        text:

copy_file:
  name: Copy file
  description: Copy a file or directory on an EasyControlX host.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Target a specific EasyControlX host when multiple hosts are configured.
      example: "01JABCDEF0123456789XYZ"
      selector:
        text:
    source_path:
      name: Source path
      description: Existing host path to copy from.
      required: true
      example: "C:\\Users\\Public\\report.txt"
      selector:
        text:
    destination_path:
      name: Destination path
      description: Target host path to copy to.
      required: true
      example: "C:\\Users\\Public\\Archive\\report.txt"
      selector:
        text:
    overwrite:
      name: Overwrite
      description: Replace the destination when it already exists.
      selector:
        boolean:

refresh:
  name: Refresh
  description: Refresh status from an EasyControlX host immediately.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Target a specific EasyControlX host when multiple hosts are configured.
      example: "01JABCDEF0123456789XYZ"
      selector:
        text:
