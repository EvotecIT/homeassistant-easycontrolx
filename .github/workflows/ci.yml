name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  lint-and-test:
    name: Lint and Test (HA ${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.3.0"
            fixture-home-assistant: "2026.3.1"
            test-plugin: "0.13.317"
            camera-dependency: "PyTurboJPEG==1.8.0"
          - home-assistant: "2026.9.4"
            fixture-home-assistant: "2026.9.4"
            test-plugin: "0.13.367"
            camera-dependency: "PyTurboJPEG==1.8.3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ha-tests.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-ha-tests.txt "homeassistant==${{ matrix.fixture-home-assistant }}" "pytest-homeassistant-custom-component==${{ matrix.test-plugin }}" "${{ matrix.camera-dependency }}"

      - name: Install exact minimum Home Assistant
        if: matrix.home-assistant == '2026.3.0'
        # No test-plugin release targets 2026.3.0. Its runtime requirements are
        # identical to 2026.3.1; use those fixtures with the exact minimum core.
        run: python -m pip install --no-deps "homeassistant==2026.3.0"

      - name: Lint
        run: ruff check .

      - name: Strict typing
        run: python -m mypy

      - name: Run tests
        run: pytest -q
