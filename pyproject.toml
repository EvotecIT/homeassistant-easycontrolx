[project]
name = "homeassistant-easycontrolx"
version = "0.1.0"
description = "Home Assistant custom integration for EasyControlX hosts"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
