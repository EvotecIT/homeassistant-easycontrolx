[project]
name = "homeassistant-easycontrolx"
version = "0.1.0"
description = "Home Assistant custom integration for EasyControlX hosts"
requires-python = ">=3.14.2"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["custom_components/easycontrolx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
